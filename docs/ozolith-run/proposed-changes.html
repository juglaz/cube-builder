<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101613">
  <title>Ozolith Run — Proposed Changes</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0d1512;
      color: #f3efe5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 0, rgb(37 91 67 / 35%), transparent 34rem),
        #0d1512;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    a { color: #91deb6; }
    h1 { margin: 10px 0 8px; font: 700 clamp(2rem, 5vw, 4rem)/1.05 Georgia, serif; }
    .eyebrow { margin: 0; color: #d0a65a; font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .lede { max-width: 70ch; margin: 0 0 30px; color: #bdc8c1; line-height: 1.6; }

    .changes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr));
      gap: 18px;
    }

    article {
      border: 1px solid #31483c;
      border-radius: 14px;
      background: rgb(16 23 19 / 88%);
      padding: 16px;
      box-shadow: 0 16px 40px rgb(0 0 0 / 22%);
    }

    .pair {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
    }

    figure { min-width: 0; margin: 0; }
    img { display: block; width: 100%; border-radius: 4.8% / 3.5%; background: #18231e; }
    figcaption { margin-top: 8px; overflow-wrap: anywhere; font-size: .84rem; font-weight: 700; text-align: center; }
    .cut figcaption { color: #e69a8b; }
    .add figcaption { color: #91deb6; }
    .arrow { color: #d0a65a; font-size: clamp(1.4rem, 4vw, 2rem); }
    .reason { margin: 14px 2px 0; color: #bdc8c1; font-size: .9rem; line-height: 1.45; }

    .legend {
      display: flex;
      gap: 16px;
      margin: 0 0 18px;
      font-size: .84rem;
      font-weight: 700;
    }
    .legend .out { color: #e69a8b; }
    .legend .in { color: #91deb6; }

    @media (max-width: 520px) {
      main { width: min(100% - 20px, 1180px); padding-top: 24px; }
      article { padding: 10px; }
      .pair { gap: 7px; }
    }
  </style>
</head>
<body>
  <main>
    <p><a href="./">← Back to The Ozolith Run</a></p>
    <p class="eyebrow">360-card cube · review board</p>
    <h1>Proposed changes</h1>
    <p class="lede">Revised after review: preserve the strongest counter engines and designated lore cards while adding flexible interaction.</p>
    <div class="legend"><span class="out">OUT</span><span class="in">IN</span></div>
    <section class="changes" id="changes"></section>
  </main>

  <script>
    const changes = [
      ["Ninth Bridge Patrol", "Requisition Raid", "Turn a weak counter payoff into flexible artifact/enchantment interaction."],
      ["Betrayal", "Malcator's Watcher", "Replace a narrow aura with a cheap artifact body that crews, blocks, and leaves value."],
      ["Spined Thopter", "Disruption Protocol", "Malcator's Watcher replaces the artifact body, opening this slot for a thematic counterspell."],
      ["Eldritch Evolution", "Tear Asunder", "Trade an off-theme tutor for a green artifact/enchantment answer with an optional BG upgrade."],
      ["Built to Smash", "Abrade", "Trade a narrow combat trick for removal that remains on-theme around machines."],
      ["Courage in Crisis", "Cankerbloom", "Keep proliferate while adding a creature and answers to artifacts and enchantments."],
    ]

    const imageUrl = (name) =>
      `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name)}&format=image&version=normal`

    const root = document.querySelector("#changes")
    for (const [cut, add, reason] of changes) {
      const article = document.createElement("article")
      article.innerHTML = `
        <div class="pair">
          <figure class="cut">
            <img loading="lazy" src="${imageUrl(cut)}" alt="${cut}">
            <figcaption>OUT · ${cut}</figcaption>
          </figure>
          <span class="arrow" aria-hidden="true">→</span>
          <figure class="add">
            <img loading="lazy" src="${imageUrl(add)}" alt="${add}">
            <figcaption>IN · ${add}</figcaption>
          </figure>
        </div>
        <p class="reason">${reason}</p>
      `
      root.append(article)
    }
  </script>
</body>
</html>
